<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl p-10 md:p-12 border border-outline-variant/15 shadow-2xl shadow-on-surface/5 relative overflow-hidden">
  <div class="absolute top-0 right-0 p-4 opacity-5 pointer-events-none">
    <span class="material-symbols-outlined text-9xl" data-icon="auto_awesome">auto_awesome</span>
  </div>
  <div class="text-center mb-10">
    <h1 class="font-headline font-extrabold text-4xl text-primary tracking-tight mb-3">Welcome Back</h1>
    <p class="text-slate-500 font-body text-sm tracking-wide">Continue your journey toward professional excellence.</p>
  </div>
  <form class="space-y-6" (ngSubmit)="onSubmit()">
    <div class="space-y-2">
      <label class="block text-xs font-bold font-headline uppercase tracking-widest text-primary/70 ml-1" for="email">Email Address</label>
      <div class="relative">
        <input class="w-full bg-surface-container-low border-0 ring-1 ring-outline-variant/30 rounded-lg px-4 py-4 text-on-surface placeholder:text-slate-400 focus:ring-2 focus:ring-secondary focus:bg-white transition-all duration-300 font-body outline-none" id="email" placeholder="executive@career.com" type="email" [(ngModel)]="email" name="email" required />
      </div>
    </div>
    <div class="space-y-2">
      <div class="flex justify-between items-center px-1">
        <label class="block text-xs font-bold font-headline uppercase tracking-widest text-primary/70" for="password">Password</label>
        <a class="text-xs font-semibold text-secondary hover:underline transition-all" href="#">Forgot Password?</a>
      </div>
      <div class="relative">
        <input class="w-full bg-surface-container-low border-0 ring-1 ring-outline-variant/30 rounded-lg px-4 py-4 text-on-surface placeholder:text-slate-400 focus:ring-2 focus:ring-secondary focus:bg-white transition-all duration-300 font-body outline-none" id="password" placeholder="••••••••••••" type="password" [(ngModel)]="password" name="password" required />
      </div>
    </div>
    <button class="w-full bg-gradient-to-br from-[#00193c] to-[#002d62] text-white py-4 rounded-xl font-headline font-bold text-lg hover:scale-[0.98] active:scale-95 transition-all duration-200 shadow-xl shadow-primary/20 flex items-center justify-center gap-2" type="submit">
      Sign In
      <span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
    </button>
  </form>
  <div class="relative my-10">
    <div class="absolute inset-0 flex items-center">
      <div class="w-full border-t border-outline-variant/20"></div>
    </div>
    <div class="relative flex justify-center text-sm">
      <span class="px-4 bg-surface-container-lowest text-slate-400 font-body lowercase tracking-tighter">or continue with</span>
    </div>
  </div>
  <div class="grid grid-cols-1 gap-4">
    <button class="flex items-center justify-center gap-3 w-full bg-white border border-outline-variant/30 py-3.5 rounded-xl font-headline font-semibold text-on-surface hover:bg-surface-container-low transition-all duration-300 group">
      <img alt="Google Logo" class="w-5 h-5 group-hover:scale-110 transition-transform" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCqOWlrINiq2OBcAgTxQ55k1rIFTwLejtG_wfZls3T4sh5hoXUjNDhl7l8d2bwIYDgqbKSg3j7Y49j2GJAprajDkLEsdl_wec4b0x_OGG8u3ir9aE-ycHLLu4ROe8RF0bBYYwe50hp8wm6a_TP-XotsYzlKCD47V-ABJ4M_35LAOF068k1R1kNA917B2zv4AFyxLln2Y_owtwTGdoaRBkxg7XG23O7TjAX-mzohK3n1eMT-tu5pA7FvCXq0sOTbEHcwFddXSdzXOuM" />
      Sign in with Google
    </button>
  </div>
  <p class="mt-10 text-center text-sm text-slate-500 font-body">
    New to ResumeAI?
    <a class="text-secondary font-bold hover:underline transition-all ml-1" routerLink="/signup">Create an account</a>
  </p>
</div>
